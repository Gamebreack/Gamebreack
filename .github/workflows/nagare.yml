# Redraws nagare/nagare.svg nightly. https://github.com/monex00/nagare
name: nagare
on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pinned to a reviewed commit; bump deliberately
      - uses: monex00/nagare@aa72e450767bbc847277e5d9d378cfbbf23c6346
        with:
          # read-only fine-grained PAT for private activity if set, else public only
          token: ${{ secrets.NAGARE_TOKEN || github.token }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nagare/nagare.svg
          git diff --cached --quiet || git commit -m "Redraw nagare"
          git push
